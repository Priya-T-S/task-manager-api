name: QA Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright
        run: |
          playwright install --with-deps chromium

      - name: Start FastAPI
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Start Streamlit
        run: |
          streamlit run frontend/app.py \
            --server.address 0.0.0.0 \
            --server.port 8501 \
            --server.headless true &

      - name: Wait for applications
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8000/ > /dev/null; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://localhost:8501/_stcore/health > /dev/null; do sleep 1; done'

      - name: Run tests
        run: |
          pytest -v --html=reports/qa-report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-report
          path: reports/qa-report.html

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
