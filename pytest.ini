[pytest]
pythonpath = .
testpaths = tests
markers =
    api: FastAPI endpoint tests (no servers needed)
    ui: Playwright tests against the running Streamlit app
# On UI test failure, keep a screenshot, trace and video in test-results/
addopts =
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --output=test-results
